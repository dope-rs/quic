[package]
name = "dope-quic"
version = "0.21.0"
edition = "2024"
rust-version.workspace = true
description = "QUIC x dope"
license = "MIT"
repository = "https://github.com/dope-rs/quic"
readme = "README.md"

[lib]
test = false

[workspace]
members = [
    ".",
]
resolver = "3"

[workspace.package]
rust-version = "1.98"

[profile.release]
panic = "abort"

[dependencies]
o3 = "0.20"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys"] }
dope = "0.21"
dope-tls = "0.21"
dope-sys = "0.21"
subtle = "2.6"
pin-project = "1"
zeroize = { version = "1", default-features = false }

[dev-dependencies]
dope-test = "0.21"
