[package]
name = "dope-quic"
version = "0.7.0"
edition = "2024"
description = "QUIC x dope"
license = "MIT"
repository = "https://github.com/dope-rs/quic"
readme = "README.md"

[dependencies]
o3 = "0.6"
shin = "0.10"
dope = "0.9"
dope-gen = "0.9"
dope-tls = "0.13"
ring = "0.17"
subtle = "2.6"
pin-project = "1"

[patch.crates-io]
shin = { path = "../shin" }
o3 = { path = "../o3" }
dope = { path = "../dope/dope" }
dope-core = { path = "../dope/core" }
dope-net = { path = "../dope/net" }
dope-gen = { path = "../dope/gen" }
